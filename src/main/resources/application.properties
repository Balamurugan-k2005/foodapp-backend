spring.application.name=foodapp-backend

# =====================================================
# Database
# =====================================================

spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:foodapp}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================
# JPA / Hibernate
# =====================================================

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =====================================================
# JWT
# =====================================================

app.jwt.secret=${JWT_SECRET:default_jwt_secret_key_change_me_in_production}
app.jwt.expiration-milliseconds=${JWT_EXPIRATION:900000}
app.jwt.refresh-expiration-milliseconds=${JWT_REFRESH_EXPIRATION:604800000}

# =====================================================
# Server
# =====================================================

server.port=${PORT:8080}

# =====================================================
# Error Handling
# =====================================================

server.error.include-message=always
spring.main.allow-bean-definition-overriding=true