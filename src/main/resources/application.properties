spring.application.name=foodapp-backend

# Construct the JDBC URL using Railway's default injected variables
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=true&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-milliseconds=${JWT_EXPIRATION:900000}
app.jwt.refresh-expiration-milliseconds=${JWT_REFRESH_EXPIRATION:604800000}

# Railway assigns a dynamic port at runtime. This will bind the app to Railway's assigned port.
server.port=${PORT:8080}

server.error.include-message=always
spring.main.allow-bean-definition-overriding=true