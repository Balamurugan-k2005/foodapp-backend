spring.application.name=app

spring.datasource.url=${SPRING_DATASOURCE_URL:${MYSQL_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:ecommerce_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:root123}}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security JWT Configurations
# 256-bit safe HMAC-SHA secret key
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# 15 minutes = 900000 milliseconds
app.jwt.expiration-milliseconds=900000
# 7 days = 604800000 milliseconds
app.jwt.refresh-expiration-milliseconds=604800000

# Error Handling Configuration
server.error.include-message=always
spring.main.allow-bean-definition-overriding=true


